
name: Koi

on:
  schedule:
    - cron: "20 0 * * *"

  workflow_dispatch:

  push:
    paths:
      - .github/workflows/koi.yml

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Generate Golden Swimming Koi
        uses: yalongwastaken/git-koi@v1
        with:
          login: AryanKhandare
          body: gold
          size: 768x256
          scale: 1
          output-dir: koi

     
      - name: Verify Koi Animation Canvas
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          data = Path("koi/koi.gif").read_bytes()

          width = int.from_bytes(data[6:8], "little")
          height = int.from_bytes(data[8:10], "little")

          print(f"Generated GIF dimensions: {width}x{height}")

          if (width, height) != (768, 256):
              raise SystemExit(
                  "ERROR: Wider pond was not generated!"
              )

          print("SUCCESS: Wider pond verified.")
          PY
