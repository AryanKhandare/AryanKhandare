
# GitHub Koi - AryanKhandare

name: Koi

on:
  schedule:
    # Daily at 5:50 AM IST
    - cron: "20 0 * * *"

  # Allow manual execution
  workflow_dispatch:

  # Run when workflow configuration changes
  push:
    paths:
      - .github/workflows/koi.yml

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest

    steps:
      # Checkout profile repository
      - uses: actions/checkout@v7

      # Generate Gold Koi
      - name: Generate Golden Koi
        uses: yalongwastaken/git-koi@v1
        with:
          body: gold
          output-dir: koi

      # Save generated GIF
      - name: Commit the koi if it changed
        shell: bash
        run: |
          git add koi/koi.gif

          if git diff --cached --quiet; then
            echo "Koi unchanged. No commit required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit --quiet -m "Update Golden GitHub Koi"
          git push --quiet
